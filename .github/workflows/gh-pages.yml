name: github pages

on:
  workflow_dispatch:
  push:
    branches:
    - blog-source
  pull_request:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.5'
          extended: true
      - name: Checkout
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: hugo --logLevel info --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/blog-source'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          
  algolia:
    runs-on: ubuntu-latest

    needs: deploy
    steps:
      - uses: actions/checkout@v3
        with:
          ref: gh-pages
      
      - name: Algolia Docsearch Uploader
        uses: guzhongren/algolia-docsearch-upload-action@v2.1.0
        env:
          FILE_PATH: "index.json"
          APPLICATION_ID: "BADKNNRXHD"
          ADMIN_API_KEY: ${{secrets.ALGOLIA_API_KEY}}
          INDEX_NAME: "index"
